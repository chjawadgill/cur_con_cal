<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Converter App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="con">
        <h2> Currency Converter </h2>
        <form>
            <div class="amount">
                <p> Enter your Amount</p>
                <input type = "text" value=" 100"/>
            </div>
        </form>
        <div class="drop">
            <div class="from">
                <p> From </p>
                <select>
                    <option> USD </option>
                    <option> EUR </option>
                    <option> GBP </option>
                    <option> JPY </option>
                    <option> AUD </option>
                </select>
            </div>
            <div class="to">
                <p> To </p>
                <select>
                    <option> EUR </option>
                    <option> USD </option>
                    <option> GBP </option>
                    <option> JPY </option>
                    <option> AUD </option>
                </select>
            </div>
    </div>
</body>
</html>
